name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: uswire-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: USWire-0.3.0-alpha-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release signing key
        env:
          USWIRE_KEYSTORE_BASE64: ${{ secrets.USWIRE_KEYSTORE_BASE64 }}
          USWIRE_STORE_PASSWORD: ${{ secrets.USWIRE_STORE_PASSWORD }}
          USWIRE_KEY_ALIAS: ${{ secrets.USWIRE_KEY_ALIAS }}
          USWIRE_KEY_PASSWORD: ${{ secrets.USWIRE_KEY_PASSWORD }}
        run: |
          if [ -z "$USWIRE_KEYSTORE_BASE64" ] || [ -z "$USWIRE_STORE_PASSWORD" ] || [ -z "$USWIRE_KEY_ALIAS" ] || [ -z "$USWIRE_KEY_PASSWORD" ]; then
            echo "USWire release signing secrets are not configured; skipping signed release."
            exit 0
          fi
          echo "$USWIRE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uswire-release.jks"
          echo "USWIRE_KEYSTORE_PATH=$RUNNER_TEMP/uswire-release.jks" >> "$GITHUB_ENV"
          echo "USWIRE_RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        if: env.USWIRE_RELEASE_SIGNING_READY == 'true'
        env:
          USWIRE_STORE_PASSWORD: ${{ secrets.USWIRE_STORE_PASSWORD }}
          USWIRE_KEY_ALIAS: ${{ secrets.USWIRE_KEY_ALIAS }}
          USWIRE_KEY_PASSWORD: ${{ secrets.USWIRE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: env.USWIRE_RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: USWire-0.3.0-alpha-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
