name: Publish Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: uswire-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release tag and signing secrets
        env:
          USWIRE_KEYSTORE_BASE64: ${{ secrets.USWIRE_KEYSTORE_BASE64 }}
          USWIRE_STORE_PASSWORD: ${{ secrets.USWIRE_STORE_PASSWORD }}
          USWIRE_KEY_ALIAS: ${{ secrets.USWIRE_KEY_ALIAS }}
          USWIRE_KEY_PASSWORD: ${{ secrets.USWIRE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-alpha"
            exit 1
          fi
          for name in USWIRE_KEYSTORE_BASE64 USWIRE_STORE_PASSWORD USWIRE_KEY_ALIAS USWIRE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$USWIRE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uswire-release.jks"
          if [[ ! -s "$RUNNER_TEMP/uswire-release.jks" ]]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          keytool -list -storetype JKS -keystore "$RUNNER_TEMP/uswire-release.jks" -storepass "$USWIRE_STORE_PASSWORD" -alias "$USWIRE_KEY_ALIAS" >/dev/null
          echo "USWIRE_KEYSTORE_PATH=$RUNNER_TEMP/uswire-release.jks" >> "$GITHUB_ENV"
          echo "USWIRE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 4))
          echo "USWIRE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Run tests and assemble signed release APK
        env:
          USWIRE_STORE_PASSWORD: ${{ secrets.USWIRE_STORE_PASSWORD }}
          USWIRE_KEY_ALIAS: ${{ secrets.USWIRE_KEY_ALIAS }}
          USWIRE_KEY_PASSWORD: ${{ secrets.USWIRE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$USWIRE_VERSION_NAME" \
            -PversionCode="$USWIRE_VERSION_CODE"

      - name: Verify APK signature and generate verification files
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          APK_NAME="USWire-$USWIRE_VERSION_NAME.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK_NAME" > "$RUNNER_TEMP/uswire-apk-badging.txt"
          PACKAGE_NAME="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$RUNNER_TEMP/uswire-apk-badging.txt" | head -n 1)"
          APK_VERSION_CODE="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" "$RUNNER_TEMP/uswire-apk-badging.txt" | head -n 1)"
          if [[ "$PACKAGE_NAME" != "com.hestalang.uswire" ]]; then
            echo "::error::Unexpected application ID: $PACKAGE_NAME"
            exit 1
          fi
          if [[ "$APK_VERSION_CODE" != "$USWIRE_VERSION_CODE" ]]; then
            echo "::error::APK versionCode does not match the monotonically increasing release version."
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_NAME" > "USWire-$USWIRE_VERSION_NAME-signature.txt"

          # Compare certificates using the actual APKs, not a text report whose
          # formatting can differ between older releases.
          PREVIOUS_TAG="$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -Fxv "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_DIR="$RUNNER_TEMP/uswire-previous-release"
            mkdir -p "$PREVIOUS_DIR"
            gh release download "$PREVIOUS_TAG" --pattern "USWire-*.apk" --dir "$PREVIOUS_DIR"
            PREVIOUS_APK="$(find "$PREVIOUS_DIR" -maxdepth 1 -type f -name 'USWire-*.apk' -print -quit)"
            if [[ -z "$PREVIOUS_APK" || ! -s "$PREVIOUS_APK" ]]; then
              echo "::error::Could not download the APK from previous release $PREVIOUS_TAG."
              exit 1
            fi
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PREVIOUS_APK" > "$RUNNER_TEMP/uswire-previous-signature.txt"
            CURRENT_SIGNATURE="$(sed -nE 's/^[[:space:]]*Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/ip' "USWire-$USWIRE_VERSION_NAME-signature.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
            PREVIOUS_SIGNATURE="$(sed -nE 's/^[[:space:]]*Signer #[0-9]+ certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/ip' "$RUNNER_TEMP/uswire-previous-signature.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$PREVIOUS_SIGNATURE" || -z "$CURRENT_SIGNATURE" ]]; then
              echo "::error::Could not extract the signing certificate SHA-256 digest from the current or previous APK."
              echo "Current signature report:"
              cat "USWire-$USWIRE_VERSION_NAME-signature.txt"
              echo "Previous signature report:"
              cat "$RUNNER_TEMP/uswire-previous-signature.txt"
              exit 1
            fi
            if [[ "$PREVIOUS_SIGNATURE" != "$CURRENT_SIGNATURE" ]]; then
              echo "::error::Signing certificate changed. This APK cannot update the previous USWire installation."
              exit 1
            fi
          fi

          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "signature_file=USWire-$USWIRE_VERSION_NAME-signature.txt" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: USWire ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.verify.outputs.apk_name }}
            ${{ steps.verify.outputs.apk_name }}.sha256
            ${{ steps.verify.outputs.signature_file }}
